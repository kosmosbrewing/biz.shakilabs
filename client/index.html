    <script>
      // v3 6.10 - 사이트 전역 테마 키. 카테고리별로 나누지 않는다(구 biz-calculator:theme:v1
      // 분열 폐기). 기존 저장값이 있으면 그대로 이전해 사용자의 선택을 유지한다.
      (() => {
        try {
          const key = "shakilabs:theme:v1";
          const legacyKey = "biz-calculator:theme:v1";
          let saved = localStorage.getItem(key);
          if (saved !== "dark" && saved !== "light") {
            const legacy = localStorage.getItem(legacyKey);
            if (legacy === "dark" || legacy === "light") {
              saved = legacy;
              localStorage.setItem(key, legacy);
            }
          }
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            saved === "dark" || saved === "light"
              ? saved
              : prefersDark
                ? "dark"
                : "light";

          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
          document.documentElement.style.colorScheme = theme;
        } catch {
          // no-op
        }
      })();
    </script>
    <style>
      :root {
        /* v3 §2.1 중성 토큰(레시피 §4) — canvas/ink/ink-muted/card/line은 hex에서 역산
           (반올림 왕복 검증 완료). 이전 값(210 40% 98%)은 차가운 청회색이었다.
           --primary(브랜드 hue 160)는 그대로 둔다 — 건드리는 건 구조색뿐. */
        --background: 60 11.11% 96.47%; /* color.canvas #F7F7F5 */
        --foreground: 0 0% 3.92%; /* color.ink #0A0A0A */
        --muted: 210 40% 96%;
        --muted-foreground: 60 3.37% 34.9%; /* color.ink-muted #5C5C56 */
        --card: 0 0% 100%; /* color.card #FFFFFF */
        --card-foreground: 0 0% 3.92%;
        /* v3 §4.4 — 브랜드 초록(160 75% 25%)이 status-success(#1B7A4A)와 같은 계열이라
           "이득"과 "브랜드"를 색으로 구분할 수 없었다. 돈·세금 그룹(finance·biz·loan·invest)을
           loan이 이미 쓰던 인디고 하나로 모은다. DESIGN_CLEANUP_PLAN §2.2 확정 표 그대로. */
        --primary: 243 55% 41%;
        --primary-foreground: 0 0% 100%;
        --secondary: 243 15% 91%;
        --secondary-foreground: 222 47% 11%;
        --accent: 243 53% 95%;
        --accent-foreground: 243 55% 30%;
        --popover: 0 0% 100%;
        --popover-foreground: 222 47% 11%;
        /* 4.49:1(배경 위)로 AA를 아슬아슬하게 놓쳤다. text-destructive는 폼 검증 메시지와
           배달수수료 표의 금액에 12px 본문으로 쓰이므로 대형 텍스트 예외가 적용되지 않는다. */
        --destructive: 0 74% 42%; /* 6.41:1 on --card */
        --destructive-foreground: 210 40% 98%; /* 6.12:1 on --destructive */
        --border: 60 8% 90.2%; /* color.line #E8E8E4 */
        --input: 214 16% 85%;
        /* v3 §2.1 color.focus — 포커스 링은 액센트가 아니라 ink다(#0A0A0A / #F5F5F5).
           패키지 --sh-color-focus가 이 값을 그대로 가져가므로 함대 전체 포커스 링 결정이다.
           미선언 시 패키지가 리터럴 222 47% 20%(슬레이트)로 조용히 폴백한다 — 반드시 명시한다. */
        --ring: 0 0% 3.92%;
        --radius: 0.4rem;
        /* @shakilabs/ui 카테고리 액센트 API (v3 §4.1) — 2차 내비 밑줄이 읽는다.
           responsive-accessibility.css에 흩어져 있던 것을 토큰 블록 한곳으로 모았다. */
        --accent-hsl: 243 55% 41%;
        --accent-muted-hsl: 243 55% 41%;
      }

      .dark {
        /* v3 §2.1 다크 중성 토큰(레시피 §4) — 양 테마 AA 재측정 완료(게이트 자기검증 포함). */
        --background: 0 0% 7.06%; /* color.canvas dark #121212 */
        --foreground: 0 0% 96.08%; /* color.ink dark #F5F5F5 */
        --muted: 217 33% 17%;
        --muted-foreground: 60 3.33% 64.71%; /* color.ink-muted dark #A8A8A2 */
        --card: 0 0% 10.98%; /* color.card dark #1C1C1C */
        --card-foreground: 0 0% 96.08%;
        /* 다크는 hue만 옮기면 틴트 위 4.5:1이 깨진다(loan 다크 27건 전례) — 명도를 다시 골랐다. */
        --primary: 243 60% 72%;
        --primary-foreground: 243 60% 10%;
        --secondary: 243 15% 20%;
        --secondary-foreground: 210 40% 96%;
        --accent: 243 40% 22%;
        --accent-foreground: 243 60% 78%;
        --popover: 217 33% 17%;
        --popover-foreground: 210 40% 96%;
        /* 다크에서 3.67:1이었다 — 어두운 카드 위 빨강은 밝기를 올려야 읽힌다.
           대신 채워진 배경(bg-destructive)에서는 흰 글자가 2.58:1로 무너지므로,
           전경을 --primary-foreground와 같은 방식으로 "앱 hue 유지 + 어둡게" 잡는다. */
        --destructive: 0 75% 72%; /* 5.74:1 on --card */
        --destructive-foreground: 0 90% 8%; /* 7.42:1 on --destructive */
        --border: 0 0% 16.47%; /* color.line dark #2A2A2A */
        --input: 214 16% 30%;
        --ring: 0 0% 96.08%;
        --accent-hsl: 243 60% 72%;
        --accent-muted-hsl: 243 60% 72%;
      }

      html {
        scroll-behavior: auto;
        font-size: 16px;
      }

      body {
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        margin: 0;
        color-scheme: light dark;
      }
    </style>
