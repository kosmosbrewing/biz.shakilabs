name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # 커밋된 SBOM·vendor 기록이 이 저장소의 것인지 대조한다.
      # 재생성 없이 파일만 읽으므로 네트워크 불필요·1초 미만·결정적이다.
      - name: Verify supply-chain artifacts
        run: npm run verify:supply-chain
